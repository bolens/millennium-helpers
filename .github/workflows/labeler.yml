name: "CI: Pull Request Labeler"

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Checks out only the trusted base branch before applying labels; never executes PR code.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Auto-Label Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout base (label definitions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # pull_request_target: use base branch only (trusted).
          ref: ${{ github.base_ref }}

      - name: Sync label colors and descriptions
        if: hashFiles('.github/labels.yml') != ''
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          # Never delete labels from PRs; push workflow owns deletions.
          skip-delete: true

      - name: Apply path and branch labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          # Drop area labels when matching paths leave the PR.
          sync-labels: true
          # Match .github paths (needed for area: ci-cd).
          dot: true
