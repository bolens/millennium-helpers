name: "CI: Actionlint"

on:
  push:
    branches: [ main ]
    # Tag pushes always run (GitHub skips path filters for tags) so the
    # release workflow gate can wait on actionlint for the tag SHA.
    tags: [ 'v*' ]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Lint and audit GitHub Actions workflows
    permissions:
      contents: read
    uses: bolens/.github/.github/workflows/reusable-actionlint.yml@3f2e5f3e61c419f3678ea8f472d24562254624c6
    with:
      security-audit: true
