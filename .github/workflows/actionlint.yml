name: "CI: Actionlint"

on:
  push:
    branches: [ main ]
    # Tag pushes always run (GitHub skips path filters for tags) so the
    # release workflow gate can wait on actionlint for the tag SHA.
    tags: [ 'v*' ]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Lint and audit GitHub Actions workflows
    permissions:
      contents: read
    uses: bolens/.github/.github/workflows/reusable-actionlint.yml@b179e4783aca035374a85da9676e0be893fa1701
    with:
      security-audit: true
